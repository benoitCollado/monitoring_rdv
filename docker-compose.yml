services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-odoo_link_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local port 5433 to avoid clashing with another Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-odoo_link_monitor}
      API_KEY: ${API_KEY:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-8}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
